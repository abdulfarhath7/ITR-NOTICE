[package]
name = "notice-desk"
version = "0.1.0"
description = "Notice Desk - income-tax notice and litigation desk"
authors = ["Notice Desk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "notice_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rand = "0.8"
thiserror = "2"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Without a logger installed, every log:: call - including the sidecar's whole
# stdout and the reason a start-up failed - goes nowhere.
tauri-plugin-log = "2"
# One window, one sidecar, one database file.
tauri-plugin-single-instance = "2"

# The keychain backend is per-platform. Windows is the shipping target;
# the Linux one is keyutils rather than secret-service so a dev machine needs
# no dbus development headers (and, being kernel-held, forgets on reboot).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[features]
# this feature is used for production builds where `devUrl` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]
