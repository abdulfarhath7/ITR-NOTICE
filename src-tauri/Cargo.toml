[package]
name = "llc"
version = "0.1.2"
description = "Litigation Command Center - income tax notice tracking for CA firms"
edition = "2021"

[lib]
name = "llc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread"] }
# Encrypted local archive. vendored-openssl = no OpenSSL install needed on Windows.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# OS keychain (Windows Credential Manager) for the portal password + DB key.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
rand = "0.8"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
chrono-tz = "0.10"
csv = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
