# Windows is the only shipping target (docs/00, docs/07). Never cross-compile it
# from Linux: the sidecar is a PyInstaller binary and has to be frozen on the
# same OS it will run on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Code signing is optional. Whether this build can do it is decided once,
      # here, because `secrets` cannot be read from a step `if:` - only from a
      # step's own `env`.
      - name: Is a signing certificate available
        id: flags
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
        run: |
          $sign = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT)) { 'no' } else { 'yes' }
          "sign=$sign" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "code signing: $sign"

      # The tag names the release; tauri.conf.json names the app version. They
      # must not drift apart silently.
      - name: Tag matches the bundle version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "tag $tag does not match tauri.conf.json version $version"
          }

      # ---------------------------------------------------------- sidecar
      # build.ps1 does the whole thing: venv, PLAYWRIGHT_BROWSERS_PATH=0 so
      # Chromium lands inside the playwright package, `playwright install`,
      # PyInstaller, then a copy into src-tauri/resources/scraper. It prefers
      # sidecar/requirements.lock.txt and warns when there is none (Q8).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the sidecar
        shell: pwsh
        run: .\sidecar\build.ps1

      # A missing sidecar does not fail the Tauri build - it fails the app at
      # first login, on the user's machine. Catch it here instead.
      - name: Check the sidecar landed
        shell: pwsh
        run: |
          $exe = "src-tauri/resources/scraper/notice_scraper.exe"
          if (-not (Test-Path $exe)) { throw "$exe is missing - the freeze failed" }
          $size = [math]::Round((Get-ChildItem src-tauri/resources/scraper -Recurse |
                                 Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "sidecar is $size MB"
          if ($size -lt 100) { throw "sidecar is only $size MB - Chromium is probably not in it" }

      # ------------------------------------------------------------- app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # The first build compiles SQLCipher and OpenSSL from source. Cache it or
      # every release pays for that again.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Authenticode. The bundler signs through the Windows certificate store,
      # so the PFX is imported here and its thumbprint written into the config
      # the build is about to read. Nothing is echoed.
      - name: Import the code-signing certificate
        if: steps.flags.outputs.sign == 'yes'
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT)
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -Force -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint
          $config | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json
          Write-Host "certificate imported"

      # ------------------------------------------------------ build + ship
      # NSIS only. There is no updater in this app (QUESTIONS.md Q2), so no
      # signing key, no updater artifacts and no latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Notice Desk ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Windows installer below. Run it on the CA's machine; the archive it creates is encrypted to that Windows profile."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: notice-desk-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
