# Windows is the only shipping target (docs/00, docs/07). Never cross-compile
# it from Linux: the sidecar is a PyInstaller binary and has to be frozen on
# the same OS it will run on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  # Read once so the signing step can be skipped cleanly when no cert is set up
  # yet, rather than failing the whole release.
  WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The bundle version is what the updater compares; the tag is what the
      # release is named. They must not drift apart silently.
      - name: Tag matches the bundle version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "tag $tag does not match tauri.conf.json version $version"
          }

      # ---------------------------------------------------------- sidecar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # A signed installer should not be built from whatever PyPI served that
      # morning. requirements.lock.txt (pip freeze from a machine the app is
      # known to work on) wins when it exists; see NOTES.md.
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.lock.txt) {
            pip install -r requirements.lock.txt
          } else {
            Write-Host "::warning::no requirements.lock.txt - building against unpinned dependencies"
            pip install -r requirements.txt
          }
          pip install pyinstaller==6.11.1

      # Playwright's package data (its node driver) is what PyInstaller
      # collects; the browser itself is downloaded on first run, not bundled.
      - name: Install the Playwright driver
        run: python -m playwright install-deps chromium || echo "no-op on windows"

      - name: Build the sidecar
        run: python packaging/build_sidecar.py

      - name: Check the sidecar landed
        shell: pwsh
        run: Get-ChildItem src-tauri/binaries

      # ------------------------------------------------------------- app
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Authenticode. The bundler signs through the Windows certificate store,
      # so the PFX is imported here and its thumbprint written into the config
      # the build is about to read. Nothing is echoed.
      - name: Import the code-signing certificate
        if: ${{ env.WINDOWS_CERT != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT)
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -Force -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint
          $config | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json
          Write-Host "certificate imported"

      # ------------------------------------------------- build + sign + ship
      # tauri-action builds the NSIS installer, signs the updater artifacts
      # with TAURI_SIGNING_PRIVATE_KEY, and creates the draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Notice Desk ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below. The installer is NSIS; every update after it is silent."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,updater

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: notice-desk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
