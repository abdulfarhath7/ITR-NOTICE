[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
files = sidecar/draftax_sidecar.py, sidecar/ingest, proxy/main.py, relay
exclude = (^app/|^sidecar/app/|^\.venv/|^build/|^dist/|^packaging/)

# The frozen legacy tree has no annotations. It is imported by the sidecar
# wrapper, so it is followed but never checked.
[mypy-app.*]
ignore_errors = True
follow_imports = silent

# Calls into the frozen tree are untyped by definition.
[mypy-ingest.*]
disallow_untyped_calls = False

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-nacl.*]
ignore_missing_imports = True
