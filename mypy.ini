[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
files = sidecar/notice_scraper.py, proxy/main.py
exclude = (^app/|^sidecar/app/|^\.venv/|^build/|^dist/|^packaging/)

# The frozen legacy tree has no annotations. It is imported by the sidecar
# wrapper, so it is followed but never checked.
[mypy-app.*]
ignore_errors = True
follow_imports = silent

[mypy-playwright.*]
ignore_missing_imports = True
