# Lint for the Python workspaces (sidecar, proxy, relay). The frozen portal
# automation under sidecar/app/ (the verified selectors and login mechanics)
# is excluded: it must not be edited to satisfy a linter.
target-version = "py312"
line-length = 100

extend-exclude = [
  "sidecar/app",
  "packaging",
  "build",
  "dist",
  ".venv",
  "**/.venv",
  "sidecar/dist",
  "sidecar/build",
  "src-tauri/resources",
  "src-tauri/target",
]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "E722"]
ignore = [
  "E501",  # line length is advisory here; the formatter owns it
]
